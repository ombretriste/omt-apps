<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OmT Apps</title>
  <meta name="description" content="Las apps de OmT Finance: UnderCTRL, PayCTRL, DocCTRL, TaskCTRL, Up to 40% y RandomIt. Gratis, instalables y con tus datos en tu móvil." />
  <meta name="theme-color" content="#0a0a12" />
  <meta property="og:title" content="OmT Apps" />
  <meta property="og:description" content="Apps sencillas para tu día a día: finanzas, nóminas, documentos, tareas y más." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OmT Apps" />
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Aplica tema y fondo antes de pintar (evita un destello del tema equivocado)
    try {
      var d = JSON.parse(localStorage.getItem('omtapps:display') || '{}');
      var light = d.theme === 'light' || (d.theme !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.documentElement.dataset.wall = d.wall || 'aurora';
    } catch (e) {}
  </script>
</head>
<body class="booting">
  <!-- Intro: los iconos llegan volando, orbitan el logo y aterrizan en su fila; luego la frase y Entrar -->
  <div id="intro" class="intro">
    <button id="skip-btn" class="skip-btn" type="button">Saltar</button>
    <header class="intro-head" id="intro-head">
      <span class="intro-wordmark">OmT <b>Apps</b></span>
    </header>
    <div class="intro-main">
      <div class="icon-row" id="icon-row"></div>
      <h1 class="intro-title" id="intro-title" aria-label="Apps sencillas para tu día a día."></h1>
    </div>
    <div class="intro-enter" id="intro-enter">
      <button id="enter-btn" class="sp-enter" type="button" aria-label="Entrar">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg>
      </button>
      <p class="sp-label">Entrar</p>
    </div>
    <p class="intro-by" id="intro-by">by OmT Finance</p>
    <!-- Durante la animación los iconos y el logo vuelan sobre todo lo demás, centrados en la pantalla -->
    <span class="intro-logo logo-slot" id="intro-logo" data-logo="104"></span>
    <div class="orbit" id="orbit"></div>
  </div>

  <!-- Página de apps: un bloque por sección, deslizables -->
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="logo-slot" data-logo="30"></span>
        <span class="brand">OmT <b>Apps</b></span>
      </div>
      <button id="menu-btn" class="icon-btn" aria-label="Más opciones" title="Más opciones" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></svg>
      </button>
    </header>

    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>

    <div class="rail-wrap">
      <button class="icon-btn rail-arrow prev" id="rail-prev" type="button" aria-label="Sección anterior">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="rail" id="rail"></div>
      <button class="icon-btn rail-arrow next" id="rail-next" type="button" aria-label="Sección siguiente">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <footer class="footer">
      <span class="footer-privacy"><span id="privacy-icon"></span>Tus datos se quedan en tu dispositivo. La nube es opcional.</span>
    </footer>
  </div>

  <div id="menu" class="menu" role="menu" hidden></div>

  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
