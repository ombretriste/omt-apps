<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#1c1a36"/><stop offset="1" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".18"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(3.3) translate(-60 -60)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- anillos del logo OmT Apps -->
    <circle cx="60" cy="60" r="52" stroke="url(#g)" stroke-width="1.6"/>
    <circle cx="60" cy="60" r="44" stroke="url(#g)" stroke-width="1" stroke-dasharray="2 5" opacity=".55"/>
    <path d="M60 8 A52 52 0 0 1 112 60" stroke="url(#g)" stroke-width="3"/>
    <circle cx="112" cy="60" r="3" fill="#a5f3fc" stroke="none"/>
    <!-- vapor -->
    <path d="M47 38 c-4 -5 4 -8 0 -14" stroke="url(#s)" stroke-width="2"/>
    <path d="M58 37 c-4 -6 4 -9 0 -16" stroke="url(#s)" stroke-width="2"/>
    <path d="M69 38 c-4 -5 4 -8 0 -14" stroke="url(#s)" stroke-width="2"/>
    <!-- taza -->
    <path d="M33 45 H83 V71 a16 16 0 0 1 -16 16 H49 a16 16 0 0 1 -16 -16 Z" stroke="url(#g)" stroke-width="2.4"/>
    <path d="M83 52 h4 a8 8 0 0 1 0 16 h-4" stroke="url(#g)" stroke-width="2.4"/>
    <!-- rejilla de apps dentro de la taza -->
    <rect x="45" y="52" width="11" height="11" rx="3" stroke="url(#g)" stroke-width="1.8"/>
    <circle cx="65.5" cy="57.5" r="5.5" stroke="#f9a8d4" stroke-width="1.8"/>
    <rect x="45" y="68" width="11" height="11" rx="3" stroke="url(#g)" stroke-width="1.8"/>
    <rect x="60" y="68" width="11" height="11" rx="3" stroke="url(#g)" stroke-width="1.8"/>
  </g>
</svg>
